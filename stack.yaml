# GHC 9.2.8 (lts-20.26) is the oldest GHC that can build a native arm64 macOS
# binary without an LLVM toolchain: aarch64-darwin support landed in 8.10.7 but
# only via the LLVM backend (needs llvm 9-12, no longer packaged), and the
# native AArch64 code generator arrived in 9.2.
#
# lts-15.11 (GHC 8.8.3), the upstream pin, has no aarch64-darwin target at all,
# which is why every upstream Rome release is x86_64-only.
resolver: lts-20.26

extra-deps:
  # Patched locally: imports Data.ByteString.Lazy.Builder, removed in
  # bytestring 0.11 (GHC 9.2.8 ships 0.11.4.0).
  - vendor/amazonka-1.6.1
  # Patched locally: amazonka-core 1.6.1 predates aeson 2.0, where Object
  # changed from `HashMap Text Value` to `KeyMap Value`. Four call sites.
  # Pinning aeson 1.x instead is not an option -- it uses Data.Semigroup.Option,
  # removed in base-4.16 (GHC 9.2), and GHC 9.2 is the minimum for native arm64.
  - vendor/amazonka-core-1.6.1
  - amazonka-s3-1.6.1
  - amazonka-sts-1.6.1

# amazonka 1.6.1 (2018) carries upper bounds that predate this snapshot.
allow-newer: true

flags: {}

extra-package-dbs: []
